# Typecheck and tests on every push and pull request. The browser suite runs only once the quick checks pass.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      # Uses the pnpm version pinned in package.json's packageManager field.
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  browser:
    name: Browser tests
    needs: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Builds and checks a separate production image (Docker is on the runner), then runs Chromium against an
      # isolated test build; see browser-tests/README.md.
      - run: pnpm test:browser
      - name: Keep traces of failed browser tests
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
